<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bu &amp; Bu Bun Dash</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap">
<style>
/* Layout: one centered column: bubble-letter header, framed game stage, key hints / touch pad. Single pastel world, light only by design. */
:root{
  --bg:#FFF0F2;
  --dot:#F9DCE2;
  --ink:#2B2026;
  --ink-soft:#6B5A63;
  --lav:#DEDBF8;
  --lav-deep:#7E74D6;
  --butter:#FAD889;
  --blush:#FF9EB4;
  --paper:#FFFCF8;
  --display:"Fredoka","Baloo 2","Arial Rounded MT Bold",system-ui,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0}
*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);background-image:radial-gradient(var(--dot) 1.6px,transparent 1.6px);background-size:22px 22px;color:var(--ink);font-family:var(--display);font-weight:500}
.wrap{max-width:1040px;margin:0 auto;padding-inline:16px;padding-block:18px 28px;display:flex;flex-direction:column;gap:14px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{margin:0;line-height:0}
.logo img{height:clamp(56px,10vw,92px);width:auto;display:block}
.tag{display:inline-block;background:var(--paper);border:3px solid var(--ink);border-radius:999px;padding:4px 14px 5px;font-weight:600;font-size:18px;letter-spacing:.04em;box-shadow:0 3px 0 var(--ink)}
.tools{display:flex;gap:8px}
.chip{font:600 15px/1 var(--display);color:var(--ink);background:var(--paper);border:3px solid var(--ink);border-radius:999px;padding:8px 14px;cursor:pointer;box-shadow:0 3px 0 var(--ink);transition:transform .08s}
.chip:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.chip[aria-pressed="true"]{background:var(--lav)}
button:focus-visible{outline:3px solid var(--lav-deep);outline-offset:3px}

/* The stage keeps a landscape shape on desktop, goes squarer on tablets and portrait phones,
   and is capped to the screen height so the whole game and controls always fit. The script
   widens or narrows the visible slice of the level to match, so nothing is stretched. */
.stage{--chrome:190px;position:relative;width:100%;aspect-ratio:960/560;max-height:calc(100svh - var(--chrome));min-height:240px;border:4px solid var(--ink);border-radius:24px;overflow:hidden;background:#DDEBFA;box-shadow:0 8px 0 var(--ink)}
.stage canvas{display:block;width:100%;height:100%;touch-action:none}
.overlay{position:absolute;inset:0;display:grid;place-items:center;padding:16px;overflow:auto;background:rgba(255,246,240,.7);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.panel{background:var(--paper);border:4px solid var(--ink);border-radius:26px;padding:22px 26px;box-shadow:0 6px 0 var(--ink);text-align:center;max-width:560px;width:100%;display:flex;flex-direction:column;gap:14px;align-items:center}
.panel h2{margin:0;font-weight:700;font-size:30px;text-wrap:balance}
.panel p{margin:0;color:var(--ink-soft);font-size:16px;line-height:1.4;max-width:46ch}
.cards{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.card{font-family:var(--display);color:var(--ink);background:#fff;border:3px solid var(--ink);border-radius:20px;padding:10px 16px 12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 4px 0 var(--ink);transition:transform .1s, background .15s;min-width:150px}
.card:hover{transform:translateY(-3px)}
.card:active{transform:translateY(2px);box-shadow:0 2px 0 var(--ink)}
.card[data-ch="lav"]{background:#F3F1FF}
.card[data-ch="white"]{background:#FFF6F7}
.card canvas{width:110px;height:110px}
.card strong{font-size:19px;font-weight:600}
.card span{font-size:14px;color:var(--ink-soft)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:0;width:100%}
.stats div{background:#FFF4F6;border:2.5px solid var(--ink);border-radius:16px;padding:8px 6px;min-width:0}
.stats dt{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
.stats dd{margin:2px 0 0;font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.btn{font:600 17px/1 var(--display);color:var(--ink);background:#fff;border:3px solid var(--ink);border-radius:999px;padding:11px 22px;cursor:pointer;box-shadow:0 4px 0 var(--ink)}
.btn.primary{background:var(--butter)}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--ink)}
.badge{display:inline-block;background:var(--blush);border:2.5px solid var(--ink);border-radius:999px;padding:3px 12px;font-weight:600;font-size:14px}

.keys{display:flex;flex-wrap:wrap;gap:8px 18px;justify-content:center;color:var(--ink-soft);font-size:15px}
.keys kbd{font:600 13px/1 var(--display);color:var(--ink);background:var(--paper);border:2px solid var(--ink);border-bottom-width:4px;border-radius:8px;padding:3px 7px;margin-inline:1px}
.pad{display:none;justify-content:space-between;gap:12px;user-select:none;-webkit-user-select:none}
.pad .grp{display:flex;gap:12px}
.pad button{font:700 26px/1 var(--display);color:var(--ink);width:76px;height:76px;border-radius:50%;border:4px solid var(--ink);background:var(--paper);box-shadow:0 5px 0 var(--ink);touch-action:none;-webkit-tap-highlight-color:transparent}
.pad button.jump{background:var(--butter);width:92px;height:92px;font-size:20px}
.pad button.on{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
@media (pointer:coarse){.pad{display:flex}.keys{display:none}.stage{--chrome:250px}}
@media (max-width:900px) and (min-width:601px){.stage{aspect-ratio:4/3}}
@media (max-width:600px){
  .wrap{padding-block:10px 16px;gap:10px}
  .stage{aspect-ratio:4/5;--chrome:230px;border-radius:18px;border-width:3px;box-shadow:0 5px 0 var(--ink)}
  .logo img{height:52px}
  .chip{font-size:13px;padding:7px 11px}
  .pad button{width:68px;height:68px}
  .pad button.jump{width:84px;height:84px}
}
/* Phones turned sideways: game fills the screen, buttons float over its lower corners */
@media (pointer:coarse) and (orientation:landscape) and (max-height:520px){
  .wrap{max-width:none;padding-block:8px;gap:0}
  .top,.keys{display:none}
  .stage{aspect-ratio:auto;height:calc(100svh - 24px);max-height:none;--chrome:0px;box-shadow:none;border-width:3px}
  .pad{position:fixed;left:max(20px,env(safe-area-inset-left));right:max(20px,env(safe-area-inset-right));bottom:max(16px,env(safe-area-inset-bottom));pointer-events:none;z-index:5}
  .pad button{pointer-events:auto;opacity:.82;width:62px;height:62px}
  .pad button.jump{width:76px;height:76px}
}
@media (max-width:640px), (max-height:520px){
  .overlay{padding:8px}
  .panel{padding:12px 14px;gap:8px;border-radius:18px}
  .panel h2{font-size:20px}
  .panel p{display:none}
  .card{min-width:0;padding:6px 10px 8px;border-radius:14px}
  .card canvas{width:58px;height:58px}
  .card strong{font-size:15px}
  .card span{font-size:12px}
  .stats{gap:6px}
  .stats dd{font-size:16px}
  .stats dt{font-size:10px}
  .btn{font-size:14px;padding:8px 14px}
  .tag{font-size:15px}
}
</style>

</head>

        <div class="cards">

      </div>
    </div>

    <div class="overlay" id="ov-pause" hidden>
      <div class="panel">
        <h2>Paused</h2>

    <div class="overlay" id="ov-end" hidden>

  <div class="pad" id="pad">
    <div class="grp"><button type="button" data-k="l" aria-label="Move left">◀</button><button type="button" data-k="r" aria-label="Move right">▶</button></div>

function drawTiles(x0, x1) {

function render() {
  ctx.setTransform(viewScale, 0, 0, viewScale, 0, 0);
  const camX = Math.round(cam);
  drawBg(camX);
  ctx.save(); ctx.translate(-camX, 0);
  const x0 = camX, x1 = camX + VW;
  if (level.cafeX < x1 + 40) drawCafe();
  drawDecor(x0, x1);
  drawTiles(x0, x1);
  for (const it of level.items) {
    if (it.taken || it.x < x0 - 40 || it.x > x1 + 40) continue;
    const rise = it.rise === undefined ? 1 : it.rise;
    const by = it.y + Math.sin(clock * 3 + it.ph) * 3 + (1 - rise) * 22;
    if (it.type === 'bun') drawBun(ctx, it.x, by, 0.85);
    else drawHeart(ctx, it.x, by, 12 * (1 + Math.sin(clock * 6 + it.ph) * 0.07));
  }
  for (const pp of pops) { ctx.globalAlpha = Math.max(0, 1 - pp.life / 0.55); drawBun(ctx, pp.x, pp.y, 0.8); ctx.globalAlpha = 1; }
  for (const e of level.enemies) { if (e.x > x0 - 60 && e.x < x1 + 60 && !(e.dead && e.squash && e.deadT > 0.5) && e.y < VH + 60) drawGrump(ctx, e); }
  if (level.tableX < x1 + 120) {
    const partner = (player ? char : 'lav') === 'lav' ? 'white' : 'lav';
    const happy = state === 'win' || state === 'won';
    const px = level.tableX + 64;
    drawBu(ctx, px, 12 * T + 1, 0.5, { ch: partner, facing: -1, t: clock + 1 });
    if (player && !happy && Math.abs(player.x - px) < 420) {
      ctx.strokeStyle = '#FF7C98'; ctx.lineWidth = 3; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(px + 22, 12 * T - 58); ctx.lineTo(px + 30, 12 * T - 70); ctx.moveTo(px + 28, 12 * T - 50); ctx.lineTo(px + 40, 12 * T - 56); ctx.stroke();
    }
    drawTable();
  }
  if (player) {
    const p = player;
    const flicker = p.inv > 0 && !p.dead && Math.floor(p.inv * 14) % 2 === 0;
    if (!flicker) {
      drawBu(ctx, p.x + p.w / 2, p.y + p.h + 1, 0.5, {
        ch: char, facing: p.facing, t: p.dead ? p.deadT : p.t, run: p.onGround && Math.abs(p.vx) > 30, air: !p.onGround && !p.dead,
        sq: p.sq + (p.onGround ? 0 : -0.05), dead: p.dead
      });
    }
  }
  for (const pt of particles) {
    const a = Math.max(0, 1 - pt.life / pt.max);
    ctx.globalAlpha = a;
    if (pt.type === 'spark') { ctx.fillStyle = pt.color; ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.s, 0, 7); ctx.fill(); ctx.lineWidth = 1.5; ctx.strokeStyle = INK; ctx.stroke(); }
    else if (pt.type === 'dust') { ctx.fillStyle = '#FFFFFF'; ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.s * (1 + pt.life * 2), 0, 7); ctx.fill(); }
    else if (pt.type === 'heart') drawHeart(ctx, pt.x, pt.y, pt.s, '#FF8FA8', false);
    else if (pt.type === 'text') {
      ctx.font = '700 20px Fredoka, system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.lineWidth = 5; ctx.strokeStyle = INK; ctx.strokeText(pt.text, pt.x, pt.y); ctx.fillStyle = '#FFFFFF'; ctx.fillText(pt.text, pt.x, pt.y);
    }
    ctx.globalAlpha = 1;
  }
  ctx.restore();
  if (player) drawHUD();
}

/* ---------- Previews on the pick screen ---------- */
const previews = [...document.querySelectorAll('canvas[data-preview]')];
function drawPreviews() {
  for (const pc of previews) {
    const c = pc.getContext('2d'); c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, pc.width, pc.height);
    c.fillStyle = pc.dataset.preview === 'lav' ? '#E6E2FF' : '#FFE4EA';
    c.beginPath(); c.arc(110, 118, 92, 0, 7); c.fill();
    c.fillStyle = 'rgba(43,32,38,.1)'; c.beginPath(); c.ellipse(110, 196, 48, 8, 0, 0, 7); c.fill();
    drawBu(c, 110, 198, 1.42, { ch: pc.dataset.preview, facing: 1, t: clock + (pc.dataset.preview === 'lav' ? 0 : 1.3) });
  }
}

/* ---------- Loop ---------- */
let last = performance.now(), acc = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (state === 'play' || state === 'win') {
    acc += dt;
    while (acc >= STEP) { update(STEP); acc -= STEP; }
  } else {
    acc = 0; clock += dt;
    if (state === 'won' || state === 'over') {
      for (const pt of particles) { pt.life += dt; pt.x += pt.vx * dt; pt.y += pt.vy * dt; }
      particles = particles.filter(pt => pt.life < pt.max);
      if (state === 'won' && Math.random() < dt * 4) particles.push({ x: level.tableX + (Math.random() - .5) * 90, y: 410, vx: (Math.random() - .5) * 30, vy: -50 - Math.random() * 40, life: 0, max: 1.8, type: 'heart', s: 5 + Math.random() * 4, float: true });
    }
  }
  if (state === 'select') {
    cam = reduced ? 0 : (0.5 - Math.cos(clock * 0.03) * 0.5) * (level.W - VW);
    drawPreviews();
  }
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---------- Input ---------- */
addEventListener('keydown', e => {
  const k = e.key;
  if (state === 'play' && (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', ' '].includes(k))) e.preventDefault();
  if (JUMPKEYS.has(k) && !keys[k]) jumpPressed = true;
  keys[k] = true;
  if (k === 'p' || k === 'P' || (k === 'Escape' && (state === 'play' || state === 'pause'))) togglePause();
  if (k === 'm' || k === 'M') toggleMute();
  if ((k === 'Enter') && state === 'select') { startGame('lav'); }
});
addEventListener('keyup', e => { keys[e.key] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; touch.l = touch.r = touch.j = false; });
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') togglePause(); });

for (const b of document.querySelectorAll('#pad button')) {
  const k = b.dataset.k;
  const on = e => { e.preventDefault(); ensureAudio(); touch[k] = true; b.classList.add('on'); if (k === 'j') jumpPressed = true; try { b.setPointerCapture(e.pointerId); } catch (_) {} };
  const off = () => { touch[k] = false; b.classList.remove('on'); };
  b.addEventListener('pointerdown', on);
  b.addEventListener('pointerup', off); b.addEventListener('pointercancel', off); b.addEventListener('lostpointercapture', off);
  b.addEventListener('contextmenu', e => e.preventDefault());
}
for (const card of document.querySelectorAll('.card')) card.addEventListener('click', () => startGame(card.dataset.ch));
$('btn-again').addEventListener('click', () => startGame(char));
$('btn-switch').addEventListener('click', showSelect);
$('btn-quit').addEventListener('click', showSelect);
$('btn-resume').addEventListener('click', togglePause);
$('btn-pause').addEventListener('click', () => { if (state === 'play' || state === 'pause') togglePause(); });
$('btn-mute').addEventListener('click', () => { toggleMute(); document.activeElement && document.activeElement.blur(); });
})();
</script>
